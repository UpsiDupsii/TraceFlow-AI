name: TraceFlow AI CI Pipeline

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  code-quality:
    name: Code Quality and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Python Linter (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test-suite:
    name: Automated Test Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Safe execution using the mock data strategies engineered in pytest
      - name: Run Unit and Integration Tests
        env:
          PROJECT_NAME: "TraceFlow-AI-Test"
          VERSION: "0.1.0"
          API_V1_STR: "/api/v1"
          ENVIRONMENT: "testing"
          OLLAMA_BASE_URL: "http://localhost:11434"
          DEFAULT_MODEL: "qwen2.5:3b"
          KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          if [ -d tests ] || ls test_*.py &> /dev/null; then
            pytest
          else
            echo "INFO: Test environment verified. Ready for custom PyTest suites."
          fi

  build-artifact:
    name: Application Compile Verification
    needs: [code-quality, test-suite]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Module Compilation
        run: python -m compileall .
